name: Windows Desktop Build

on:
  push:
    branches:
      - windows-executable-build
  pull_request:
    branches:
      - main
      - feature/windows-desktop-port-main
      - windows-executable-build
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm.cmd install

      - name: Prepare desktop runtime configuration
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          EMBED_SERVERS: ${{ vars.EMBED_SERVERS }}
          EMBED_VIDCORE_NAME: ${{ vars.EMBED_VIDCORE_NAME }}
          EMBED_VIDCORE_BASE_URL: ${{ vars.EMBED_VIDCORE_BASE_URL }}
          EMBED_VIDCORE_MOVIE_PATH_TEMPLATE: ${{ vars.EMBED_VIDCORE_MOVIE_PATH_TEMPLATE }}
          EMBED_VIDCORE_TV_PATH_TEMPLATE: ${{ vars.EMBED_VIDCORE_TV_PATH_TEMPLATE }}
          EMBED_VIDSRC_NAME: ${{ vars.EMBED_VIDSRC_NAME }}
          EMBED_VIDSRC_BASE_URL: ${{ vars.EMBED_VIDSRC_BASE_URL }}
          EMBED_VIDSRC_MOVIE_PATH_TEMPLATE: ${{ vars.EMBED_VIDSRC_MOVIE_PATH_TEMPLATE }}
          EMBED_VIDSRC_TV_PATH_TEMPLATE: ${{ vars.EMBED_VIDSRC_TV_PATH_TEMPLATE }}
        shell: pwsh
        run: |
          if (-not $env:TMDB_READ_TOKEN) { throw 'TMDB_READ_TOKEN secret is not configured.' }
          $names = @(
            'EMBED_SERVERS',
            'EMBED_VIDCORE_NAME',
            'EMBED_VIDCORE_BASE_URL',
            'EMBED_VIDCORE_MOVIE_PATH_TEMPLATE',
            'EMBED_VIDCORE_TV_PATH_TEMPLATE',
            'EMBED_VIDSRC_NAME',
            'EMBED_VIDSRC_BASE_URL',
            'EMBED_VIDSRC_MOVIE_PATH_TEMPLATE',
            'EMBED_VIDSRC_TV_PATH_TEMPLATE'
          )
          $lines = @('TMDB_API_READ_ACCESS_TOKEN="' + ($env:TMDB_READ_TOKEN -replace '\\', '\\\\' -replace '"', '\\"') + '"')
          foreach ($name in $names) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($null -ne $value -and $value -ne '') {
              $escaped = $value -replace '\\', '\\\\' -replace '"', '\\"' -replace "`r?`n", '\n'
              $lines += $name + '="' + $escaped + '"'
            }
          }
          Set-Content -Path runtime.env -Value ($lines -join "`n") -Encoding UTF8
          if (-not $env:EMBED_SERVERS) { throw 'EMBED_SERVERS repository variable is not configured.' }
          Write-Host "Prepared runtime configuration for external providers: $env:EMBED_SERVERS"

      - name: Validate JavaScript
        run: npm.cmd run check

      - name: Build Windows installer
        run: npm.cmd run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: mystery-vault-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
