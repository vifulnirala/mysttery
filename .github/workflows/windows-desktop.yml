name: Windows Desktop Build

on:
  push:
    branches:
      - windows-executable-build
  pull_request:
    branches:
      - main
      - feature/windows-desktop-port-main
      - windows-executable-build
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm.cmd install

      - name: Prepare desktop runtime configuration
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $vars = gh variable list --repo "$env:GITHUB_REPOSITORY" --json name,value | ConvertFrom-Json
          $wanted = @('EMBED_SERVERS')
          $wanted += $vars | Where-Object { $_.name -match '^EMBED_[A-Z0-9_-]+_(NAME|BASE_URL|MOVIE_PATH_TEMPLATE|TV_PATH_TEMPLATE)$' } | ForEach-Object { $_.name }
          $lines = @()
          if (-not $env:TMDB_READ_TOKEN) { throw 'TMDB_READ_TOKEN secret is not configured.' }
          $lines += 'TMDB_API_READ_ACCESS_TOKEN=' + $env:TMDB_READ_TOKEN
          foreach ($name in $wanted | Sort-Object -Unique) {
            $value = ($vars | Where-Object { $_.name -eq $name } | Select-Object -First 1).value
            if ($null -ne $value) {
              $escaped = [string]$value -replace '\\', '\\\\' -replace '"', '\\"' -replace "`r?`n", '\n'
              $lines += $name + '="' + $escaped + '"'
            }
          }
          Set-Content -Path runtime.env -Value ($lines -join "`n") -Encoding UTF8
          if (-not ($lines -match '^EMBED_SERVERS=')) { Write-Warning 'EMBED_SERVERS repository variable was not found.' }

      - name: Validate JavaScript
        run: npm.cmd run check

      - name: Build Windows installer
        run: npm.cmd run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: mystery-vault-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
