name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-port
    paths:
      - "android/**"
      - "server.js"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js for backend dependency staging
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Stage the unchanged Mystery Vault backend and dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --omit=dev --omit=optional
          mkdir -p android/app/src/main/assets/backend
          cp server.js android/app/src/main/assets/backend/
          cp -a public android/app/src/main/assets/backend/
          cp -a node_modules android/app/src/main/assets/backend/

          # Replace the Linux-host node-datachannel binary with Android/Bionic ARM64.
          # This only changes the staged Android copy, not backend source or manifests.
          NDC_DIR="android/app/src/main/assets/backend/node_modules"
          rm -rf "$NDC_DIR/node-datachannel" "$NDC_DIR/@node-datachannel"
          mkdir -p /tmp/node-datachannel-android "$NDC_DIR/node-datachannel" "$NDC_DIR/@node-datachannel/android-arm64"
          npm pack node-datachannel@0.33.6 --pack-destination /tmp/node-datachannel-android
          npm pack @node-datachannel/android-arm64@0.33.6 --pack-destination /tmp/node-datachannel-android
          tar -xzf /tmp/node-datachannel-android/node-datachannel-0.33.6.tgz -C "$NDC_DIR/node-datachannel" --strip-components=1
          tar -xzf /tmp/node-datachannel-android/node-datachannel-android-arm64-0.33.6.tgz -C "$NDC_DIR/@node-datachannel/android-arm64" --strip-components=1
          test -f "$NDC_DIR/node-datachannel/dist/cjs/lib/index.cjs"
          test -f "$NDC_DIR/@node-datachannel/android-arm64/package.json"
          ADDON="$(find "$NDC_DIR/@node-datachannel/android-arm64" -type f -name '*.node' -print -quit)"
          test -n "$ADDON"
          readelf -h "$ADDON" | grep -q 'AArch64'
          echo "Android node-datachannel addon: $ADDON"
          test -f android/app/src/main/assets/backend/server.js
          test -f android/app/src/main/assets/backend/public/index.html
          test -f android/app/src/main/assets/backend/node_modules/express/package.json
          echo "Backend staged: $(du -sh android/app/src/main/assets/backend | cut -f1)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.3.13750724 cmake;3.22.1"

      - name: Download pinned Node.js 26 mobile runtime
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/fogtape/nodejs-mobile/releases/download/v26.12.1-0/nodejs-mobile-android-26.12.1-0.zip"
          curl -fL "$URL" -o /tmp/nodejs-mobile.zip
          echo "58e0b7d9455b06703d4001eddfe0445f9cd9671b9045b665dce0e725cd7b994e  /tmp/nodejs-mobile.zip" | sha256sum -c -
          mkdir -p /tmp/nodejs-mobile
          unzip -q /tmp/nodejs-mobile.zip -d /tmp/nodejs-mobile
          NODE_HEADER="$(find /tmp/nodejs-mobile -type f -name node.h -print -quit)"
          test -n "$NODE_HEADER"
          NODE_INCLUDE_DIR="$(dirname "$NODE_HEADER")"
          echo "NODE_INCLUDE_DIR=$NODE_INCLUDE_DIR" >> "$GITHUB_ENV"
          for ABI in arm64-v8a; do
            LIB="$(find /tmp/nodejs-mobile -type f -path "*/$ABI/libnode.so" -print -quit)"
            test -n "$LIB"
            mkdir -p "android/app/src/main/jniLibs/$ABI"
            cp "$LIB" "android/app/src/main/jniLibs/$ABI/libnode.so"
          done
          mkdir -p android/app/node-include
          cp -a "$NODE_INCLUDE_DIR/." android/app/node-include/

      - name: Package Android C++ shared runtime
        shell: bash
        run: |
          set -euo pipefail
          NDK_ROOT="${ANDROID_HOME}/ndk/27.3.13750724"
          HOST_TAG="linux-x86_64"
          declare -A TRIPLE_BY_ABI=(
            [arm64-v8a]=aarch64-linux-android
          )
          for ABI in arm64-v8a; do
            RUNTIME="${NDK_ROOT}/toolchains/llvm/prebuilt/${HOST_TAG}/sysroot/usr/lib/${TRIPLE_BY_ABI[$ABI]}/libc++_shared.so"
            test -f "$RUNTIME"
            cp "$RUNTIME" "android/app/src/main/jniLibs/$ABI/libc++_shared.so"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mystery-vault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
