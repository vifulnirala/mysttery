name: Native Windows (WinUI 3)
on:
  push:
    branches: [native-windows-winui3]
  pull_request:
    branches: [native-windows-winui3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Verify Windows build toolchain
        shell: pwsh
        run: |
          where.exe msbuild
          msbuild -version
      - name: Restore and build x64
        run: msbuild src/MysteryVault.Native/MysteryVault.Native.csproj /restore /t:Build /p:Configuration=Release /p:Platform=x64 /p:WindowsPackageType=None /verbosity:minimal
      - name: Print XAML compiler diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          $obj = "src/MysteryVault.Native/obj/x64/Release/net8.0-windows10.0.19041.0"
          foreach ($name in @("input.json", "output.json")) {
            $file = Join-Path $obj $name
            if (Test-Path $file) {
              Write-Host "----- $file -----"
              Get-Content $file -Raw
            }
          }
      - name: Publish x64
        run: msbuild src/MysteryVault.Native/MysteryVault.Native.csproj /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:WindowsPackageType=None /p:PublishDir=artifacts/native-win-x64/ /verbosity:minimal
      - uses: actions/upload-artifact@v4
        with:
          name: mystery-vault-native-win-x64
          path: artifacts/native-win-x64/**
          if-no-files-found: error
          retention-days: 14
