name: Test Firebase push functions

on:
  workflow_dispatch:
  push:
    branches:
      - android-push-notifications
    paths:
      - "functions/**"
      - "firebase.json"
      - "firestore.rules"
      - ".github/workflows/test-push-functions.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Cloud Functions JavaScript syntax
        run: node --check functions/index.js
      - name: Run pairing-code unit tests
        run: node --test functions/test.js
